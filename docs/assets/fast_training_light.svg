<svg xmlns="http://www.w3.org/2000/svg" width="860" height="448" viewBox="0 0 860 448" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Training time to a held-out normalized return of 0.83 on MS-Human-700, step by step: First release (SuperMimic, 4096 environments) 4.3 h; + method changes (InstantTrack, BlinkMimic; adapted to 694 muscles) 1.8 h; + no muscle obs., update graphs (ours; the CUDA graphs: InstantTrack, BlinkMimic) 36 min; + collection as a CUDA graph (BlinkMimic's idea, our MuJoCo-Warp wrapper) 24 min; + 1024 envs, overlapped collection (ours) 14 min; + Beta exploration noise (ours) 9.0 min; + 50 Hz control (ours) 6.4 min; + test-time refinement (ours; five gradient steps through the world model) 5.2 min; 49 times faster in all">
<defs><pattern id="both" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="4" height="8" fill="#1baf7a"/><rect x="4" width="4" height="8" fill="#eb6834"/></pattern></defs>
