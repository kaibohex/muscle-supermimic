<svg xmlns="http://www.w3.org/2000/svg" width="860" height="492" viewBox="0 0 860 492" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Training time to a held-out normalized return of 0.83 on MS-Human-700, step by step, each the mean of three seeds: First release (SuperMimic, 4096 environments) 3.9 h; + method changes (InstantTrack, BlinkMimic; adapted to 700 muscles) 1.8 h; + no muscle obs., update graphs (ours; the CUDA graphs: InstantTrack, BlinkMimic) 37.2 min; + collection as a CUDA graph (BlinkMimic's idea, our MuJoCo-Warp wrapper) 24.2 min; + 1024 envs, overlapped collection (ours) 14.4 min; + no rematerialization (ours) 13.7 min; + Beta exploration noise (ours) 8.7 min; + 50 Hz control (ours) 6.3 min; + test-time refinement (ours; five gradient steps through the world model) 5.1 min; 37 times sooner than the first release at 50 Hz">
