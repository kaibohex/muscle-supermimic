<text x="321.7" y="282.0" font-size="12" font-weight="600" fill="#1a1a1a">9.0 min<tspan font-weight="400" fill="#5f5e5a">  1.6× faster</tspan></text>
<path d="M300.0,312.0H305.7A4,4 0 0 1 309.7,316.0V328.0A4,4 0 0 1 305.7,332.0H300.0Z" fill="#eb6834"/>
