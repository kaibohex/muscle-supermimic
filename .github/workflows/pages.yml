# Publishes the project page (docs/website/) to GitHub Pages. One-time setup: Settings -> Pages -> Source:
# GitHub Actions. Skipped while the repository is private.
name: Project page

on:
  push:
    branches: [master]
    paths: ["docs/website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website
      - id: deployment
        uses: actions/deploy-pages@v4
